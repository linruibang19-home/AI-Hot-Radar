# AI Hot Radar production stack (M5).
#
#   docker compose -f infra/compose/docker-compose.prod.yml up -d
#
# Three differences from the local stack, each with a reason:
#
# 1. **Nothing but Caddy is published.** Locally every service maps a host port
#    so a developer can curl it. On a public host those same lines would put
#    Postgres, Redis, core-api and ai-service on the internet with no
#    authentication in front of them — the site has no accounts until later in
#    M5, so an exposed core-api is an open write surface and an exposed
#    ai-service is an unmetered LLM bill.
#
# 2. **Images are pulled, not built.** A 2 GB host OOMs during `next build` and
#    the Maven compile. `release.yml` builds them in Actions and pushes to GHCR,
#    which also means a rollback is `IMAGE_TAG=<previous> docker compose up -d`
#    rather than a rebuild from a commit that may no longer be checked out.
#
# 3. **Every service has a memory limit.** Measured idle usage is about 1.0 GB
#    across the stack, so 4 GB is comfortable — but core-api runs with
#    `-XX:MaxRAMPercentage=75`, and with no container limit the JVM resolves
#    that against the *host*: 3 GB of heap on a 4 GB box, for a service
#    measured at 363 MB. The limits below are what make that percentage mean
#    what it looks like it means. They also convert "one runaway container"
#    from an outage into a restart.
#
# 4. **TLS is Caddy's job.** Two lines of config for issuance and renewal, in
#    front of Cloudflare's own certificate. Cloudflare must be set to
#    **Full (strict)**: Flexible leaves Cloudflare→origin in plaintext while the
#    padlock still shows, which is worse than no TLS because it looks fine.
#
# Required in `.env` beside this file (see .env.example):
#   IMAGE_TAG, IMAGE_REPO, SITE_DOMAIN, PUBLIC_BASE_URL, ACME_EMAIL,
#   POSTGRES_*, DEEPSEEK_API_KEY, SILICONFLOW_API_KEY, GITHUB_TOKEN

name: ai-hot-radar

x-image-repo: &image-repo ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}

x-logging: &default-logging
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *default-logging
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_hot_radar}
      POSTGRES_USER: ${POSTGRES_USER:-ai_hot_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    # No `ports:`. The database is reachable only on the Compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_hot_radar} -d ${POSTGRES_DB:-ai_hot_radar}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Measured 300 MB. The rest is room for the shared buffers and
    # sort memory a growing corpus will want.
    mem_limit: 640m
    restart: unless-stopped

  redis:
    <<: *default-logging
    image: redis:7-alpine
    # ADR-005 scopes Redis to cache, rate limiting and short locks — nothing
    # here is a source of truth, so evicting under pressure is correct
    # behaviour rather than data loss. Without `maxmemory` the answer cache
    # grows until the container limit kills it, which turns a cache miss into
    # a restart.
    command:
      [
        "redis-server",
        "--save", "",
        "--appendonly", "no",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Measured 8 MB. The limit is a backstop; `maxmemory` below is the
    # real control, because a cache hitting a container limit is an OOM kill
    # while a cache hitting `maxmemory` just evicts.
    mem_limit: 192m
    restart: unless-stopped

  core-api:
    <<: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}/core-api:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_hot_radar}
      REDIS_URL: redis://redis:6379/0
      WORKER_BASE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set}
      # No default. Unset, core-api registers no credential and the admin
      # API refuses everything — but failing at startup is louder than a
      # console nobody can log into. Generate with `openssl rand -hex 32`.
      AHR_ADMIN_BOOTSTRAP_TOKEN: ${AHR_ADMIN_BOOTSTRAP_TOKEN:?AHR_ADMIN_BOOTSTRAP_TOKEN must be set}
      AHR_ADMIN_VIEWER_TOKEN: ${AHR_ADMIN_VIEWER_TOKEN:?AHR_ADMIN_VIEWER_TOKEN must be set}
      # Wraps the generation provider's API key before it reaches PostgreSQL
      # (V027). Base64 of 32 random bytes: `openssl rand -base64 32`.
      #
      # Required rather than defaulted, and required on every container that
      # touches that row. Unset, this one starts fine and reports that the
      # console cannot store a key — a save button that returns 503 — which is
      # a worse failure than not starting, because the feature looks present.
      LLM_CREDENTIAL_MASTER_KEY: ${LLM_CREDENTIAL_MASTER_KEY:?LLM_CREDENTIAL_MASTER_KEY must be set}
    env_file:
      - path: ${AHR_ENV_FILE:-.env}
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The 512 MiB container ceiling makes MaxRAMPercentage=75 resolve to an
    # estimated ~371 MiB max heap on the current Temurin 21 runtime (the JVM
    # reserves native/container headroom), instead of sizing from the host.
    mem_limit: 512m
    restart: unless-stopped

  ai-service:
    <<: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}/ai-service:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-AIHotRadarBot/1.0 (+https://kuritian.online/bot)}
      # A ceiling on what this deployment spends per day, counted from
      # provider-reported tokens in `llm_usage`. Bounds the deployment where
      # the per-caller quota bounds one visitor, and unlike that quota it does
      # not vanish when Redis restarts.
      #
      # Does NOT replace the provider-side cap: the embedding and rerank
      # accounts are a different provider and are not recorded in `llm_usage`.
      # 0 disables it. Set it from `ahr.cli usage --days 7`, not from this
      # default.
      LLM_DAILY_TOKEN_LIMIT: ${LLM_DAILY_TOKEN_LIMIT:-2000000}
      # Explicit production values; local Compose deliberately loosens these
      # because every local caller shares the Docker gateway address.
      RAG_RATE_PER_MINUTE: ${RAG_RATE_PER_MINUTE:-3}
      RAG_RATE_PER_DAY: ${RAG_RATE_PER_DAY:-20}
      # Same expression core-api uses. Resolved from two different places the
      # two would disagree the moment a real value is set, and the symptom
      # would be an undecryptable credential rather than a config error.
      LLM_CREDENTIAL_MASTER_KEY: ${LLM_CREDENTIAL_MASTER_KEY:?LLM_CREDENTIAL_MASTER_KEY must be set}
    env_file:
      - path: ${AHR_ENV_FILE:-.env}
        required: true
    volumes:
      - ../../config:/app/config:ro
      - ../../data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Measured 53 MB. Embedding and reranking are API calls, so nothing
    # large is ever resident; the headroom is for request concurrency.
    mem_limit: 448m
    restart: unless-stopped

  scheduler:
    <<: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}/ai-service:${IMAGE_TAG:-latest}
    command:
      ["python", "-m", "ahr.cli", "schedule", "--interval", "120", "--batch-size", "10"]
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-AIHotRadarBot/1.0 (+https://kuritian.online/bot)}
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: ${AHR_ENV_FILE:-.env}
        required: true
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Measured 154 MB — the highest of the Python processes, because it
    # holds parsed feed documents while ingesting.
    mem_limit: 320m
    restart: unless-stopped
    healthcheck:
      disable: true

  pipeline:
    <<: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}/ai-service:${IMAGE_TAG:-latest}
    command:
      [
        "python", "-m", "ahr.cli", "pipeline",
        "--interval", "900",
        "--process-limit", "60",
        "--reason-limit", "40",
      ]
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      # This worker builds its own generation client for enrichment,
      # recommendation reasons and reports, so it needs the envelope key too.
      # Left out, it starts fine and then fails every LLM stage, silently, one
      # pass at a time — the asymmetric failure the other two do not have.
      LLM_CREDENTIAL_MASTER_KEY: ${LLM_CREDENTIAL_MASTER_KEY:?LLM_CREDENTIAL_MASTER_KEY must be set}
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: ${AHR_ENV_FILE:-.env}
        required: true
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      # V025 is applied by core-api/Flyway. Waiting for PostgreSQL alone can
      # start the new pipeline image before its table and function exist.
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Measured 46 MB, but it processes documents in batches of 60.
    mem_limit: 320m
    restart: unless-stopped
    healthcheck:
      disable: true

  web:
    <<: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}/web:${IMAGE_TAG:-latest}
    environment:
      API_BASE_URL: http://core-api:8080
      AI_SERVICE_URL: http://ai-service:8000
      # Absolute URLs in og:, canonical and sitemap.xml. Left at localhost these
      # would ship a sitemap pointing at the visitor's own machine.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be the public origin}
      # Read-only by role: the web tier renders the source console and never
      # mutates, so compromising this container does not hand over ingestion.
      AHR_ADMIN_VIEWER_TOKEN: ${AHR_ADMIN_VIEWER_TOKEN:?AHR_ADMIN_VIEWER_TOKEN must be set}
    depends_on:
      core-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    # Measured 54 MB. Next's server keeps a render cache.
    mem_limit: 320m
    restart: unless-stopped

  # The only container with a published port.
  caddy:
    <<: *default-logging
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    # Measured under 20 MB; it terminates TLS and proxies one upstream.
    mem_limit: 128m
    restart: unless-stopped

  # Nightly `pg_dump`, seven days retained. Not a cron on the host: a backup
  # that lives outside the deployment is one more thing to remember when the
  # server is rebuilt, and this one comes up with the stack.
  backup:
    <<: *default-logging
    image: pgvector/pgvector:pg16
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-ai_hot_radar}
      PGUSER: ${POSTGRES_USER:-ai_hot_radar}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ../scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Idle almost all day; `pg_dump -Fc` compresses in memory during the
    # nightly run.
    mem_limit: 192m
    restart: unless-stopped

  # Internal health and backup-age monitor. It has no Docker socket and cannot
  # mutate the stack; after a bounded number of failures it posts a redacted
  # event to the operator-provided HTTPS webhook.
  monitor:
    <<: *default-logging
    image: ${IMAGE_REPO:-ghcr.io/linruibang19-home/ai-hot-radar}/ai-service:${IMAGE_TAG:-latest}
    command: ["python", "/monitor.py"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_FAILURE_THRESHOLD: ${ALERT_FAILURE_THRESHOLD:-3}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
      BACKUP_DIR: /backups
    volumes:
      - ../scripts/monitor.py:/monitor.py:ro
      - ./backups:/backups:ro
    depends_on:
      core-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      web:
        condition: service_healthy
      backup:
        condition: service_started
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      disable: true

  # On-demand, isolated restore rehearsal. It only accepts a database whose
  # name starts with ai_hot_radar_restore_verify and removes it on success.
  restore-verify:
    <<: *default-logging
    profiles: ["tools"]
    image: pgvector/pgvector:pg16
    entrypoint: ["/bin/sh", "/restore-verify.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-ai_hot_radar}
      PGUSER: ${POSTGRES_USER:-ai_hot_radar}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_TARGET_DATABASE: ${RESTORE_TARGET_DATABASE:-ai_hot_radar_restore_verify}
    volumes:
      - ../scripts/restore-verify.sh:/restore-verify.sh:ro
      - ./backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
