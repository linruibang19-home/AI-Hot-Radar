services:
  ai-service:
    # Reuse the Dockerfile's network-isolated test stage through Compose so
    # local verification follows the project's single supported run path.
    build:
      target: test
    image: ai-hot-radar-ai-service-test:latest
    working_dir: /workspace/apps/ai-service
    environment:
      PYTHONPATH: /workspace/apps/ai-service/src
    volumes:
      # The test image owns the toolchain; this bind mount keeps the code under
      # test equal to the working tree without rebuilding after every edit. The
      # repository depth is preserved because a few delivery tests resolve
      # compose/config files from the test file's absolute path.
      - ../../:/workspace
