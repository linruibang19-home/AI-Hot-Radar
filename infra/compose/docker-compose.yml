# AI Hot Radar local stack (M0).
#
# Run from the repository root:
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#
# ADR-004 keeps pgvector in the same PostgreSQL instance as business data, so
# the image is pgvector/pgvector rather than plain postgres.

name: ai-hot-radar

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_hot_radar}
      POSTGRES_USER: ${POSTGRES_USER:-ai_hot_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    env_file:
      - path: ../../.env
        required: false
    ports:
      # 5433 on the host, not 5432. A locally installed PostgreSQL service
      # (postgresql-x64-16) already listens on 5432, so both bound the port and
      # a client connecting to localhost:5432 reached whichever won — the error
      # looked like a wrong password because PostgreSQL deliberately refuses to
      # say whether a role exists. Container-to-container traffic is unaffected:
      # it uses `postgres:5432` on the Compose network.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports true before the init scripts finish, so the
      # dependent services would race the first migration.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_hot_radar} -d ${POSTGRES_DB:-ai_hot_radar}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    # ADR-005: cache, rate limiting and short locks only. No persistence of
    # business facts, so an empty volume on restart is acceptable by design.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build:
      # Root context: the image needs database/migrations for Flyway.
      context: ../..
      dockerfile: apps/core-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_hot_radar}
      REDIS_URL: redis://redis:6379/0
      WORKER_BASE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me}
      # Registers the first admin credential (AHR-QSO-700 §3). A shared
      # development default, like the Postgres password above; production
      # requires it explicitly and refuses to start without it.
      AHR_ADMIN_BOOTSTRAP_TOKEN: ${AHR_ADMIN_BOOTSTRAP_TOKEN:-local-development-admin-token-do-not-deploy}
      AHR_ADMIN_VIEWER_TOKEN: ${AHR_ADMIN_VIEWER_TOKEN:-local-development-viewer-token-do-not-deploy}
    # POSTGRES_USER / POSTGRES_PASSWORD arrive from here rather than from
    # `environment:`, which would override them with the interpolated default.
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      # No DATABASE_URL here on purpose: Compose interpolates ${VAR} from a
      # .env beside this file, never from `env_file:`, so a password kept in
      # the repository-root .env would silently resolve to the default. The
      # service builds its own conninfo from the POSTGRES_* variables that
      # `env_file` does deliver (see ahr/config.py).
      REDIS_URL: redis://redis:6379/0
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-AIHotRadarBot/1.0 (+https://example.com/bot)}
    # Compose resolves ${VAR} against a .env beside this file, not the repo
    # root, so secrets are loaded explicitly from the root .env instead.
    env_file:
      - path: ../../.env
        required: false
    volumes:
      # The source registry is configuration, not code: mounting it read-only
      # lets operators edit sources.yaml and re-run sync without rebuilding.
      - ../../config:/app/config:ro
      # The RAG golden set is annotated by hand and revised as the corpus
      # grows; mounting it keeps `rag-eval` runnable without a rebuild between
      # annotation passes.
      - ../../data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Long-running ingestion worker. Separate from ai-service so the HTTP service
  # stays responsive while polling runs, and so the M1 "30 sources for 24h"
  # acceptance can accumulate without a shell session holding it open.
  # `restart: unless-stopped` means a crash resumes the clock rather than
  # silently ending the run.
  scheduler:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    command:
      ["python", "-m", "ahr.cli", "schedule", "--interval", "120", "--batch-size", "10"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      # DATABASE_URL is composed in ahr/config.py — see the note on ai-service.
      REDIS_URL: redis://redis:6379/0
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-AIHotRadarBot/1.0 (+https://example.com/bot)}
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No ports: this worker is not an HTTP service. The image's healthcheck
    # probes :8000, which this container never serves, so it is disabled here
    # rather than left to report a permanent false failure.
    healthcheck:
      disable: true

  # Everything after ingestion. Separate from `scheduler` because the two have
  # different shapes: ingestion is network-bound and cheap, so it polls every
  # two minutes; this one spends money on the model, so it runs on a much longer
  # interval and skips work that would produce an identical result.
  #
  # Without this service the site collected content continuously and displayed
  # none of it — 精选, 热点, 事件聚合 and 日报 were all frozen at the last manual
  # CLI run while 141 items sat unprocessed.
  pipeline:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    command:
      [
        "python", "-m", "ahr.cli", "pipeline",
        "--interval", "900",
        "--process-limit", "60",
        "--reason-limit", "40",
      ]
    environment:
      APP_ENV: ${APP_ENV:-local}
      # DATABASE_URL is composed in ahr/config.py — see the note on ai-service.
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  # Trace viewer for local debugging. Not in the production compose: it is a
  # development tool, and `ahr.tracing` is a no-op when nothing points at it.
  #
  # Traces are off by default even here — set OTEL_EXPORTER_OTLP_ENDPOINT on
  # ai-service to http://jaeger:4317 and rebuild with the `tracing` extra to
  # turn them on.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      disable: true

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://core-api:8080
      # Generation lives in ai-service (AHR-ARCH-200 §3), so the ask proxy
      # needs its address; the browser never sees either.
      AI_SERVICE_URL: http://ai-service:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Read-only by role. The console is server-rendered, so this token stays
      # in the container and never reaches a browser; mutations are made with
      # the operator's own credential, which the web tier does not hold.
      AHR_ADMIN_VIEWER_TOKEN: ${AHR_ADMIN_VIEWER_TOKEN:-local-development-viewer-token-do-not-deploy}
    ports:
      - "3000:3000"
    depends_on:
      - core-api
      - ai-service

volumes:
  postgres_data:
