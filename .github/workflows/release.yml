name: Release

# Build the three images and push them to GHCR (M5).
#
# Building on the server was the alternative and it does not work: `next build`
# and the Maven compile each peak well above what a 2 GB host has spare, so the
# first deploy would OOM. Building here also ties an image to the commit that
# produced it, which is what makes a rollback `IMAGE_TAG=<previous>` instead of
# a rebuild from a checkout that may have moved on.
#
# Deploy after this finishes:
#   ssh <host> 'cd ai-hot-radar && IMAGE_TAG=<sha> docker compose \
#     -f infra/compose/docker-compose.prod.yml pull && \
#     IMAGE_TAG=<sha> docker compose -f infra/compose/docker-compose.prod.yml up -d'

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing image must not cancel the others: a partial set is easier to
      # reason about than a set where some builds were killed mid-flight.
      fail-fast: false
      matrix:
        include:
          - service: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - service: ai-service
            context: apps/ai-service
            dockerfile: apps/ai-service/Dockerfile
          # Root context: Flyway migrations live at database/migrations and are
          # copied into the image at build time, so the image and its schema
          # ship together.
          - service: core-api
            context: .
            dockerfile: apps/core-api/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          # `sha` is the tag the compose file pins, so a deployment names the
          # exact commit it is running. `latest` exists for a first bring-up.
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: without it every run reinstalls the
          # whole Python and npm dependency tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max
