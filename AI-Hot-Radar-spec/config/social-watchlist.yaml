validation_rules:
  - "All entries remain disabled without an authorized adapter configuration"
  - "A social signal cannot be selected as a story's primary_source"
  - "If canonical_fallback_source_ids is empty, editor review is mandatory"
  - "Do not use unofficial mirrors, Nitter instances, cookie replay, or login bypass"
