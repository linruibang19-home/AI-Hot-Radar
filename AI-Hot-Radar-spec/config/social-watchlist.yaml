  - {id: wechat-ai-tech-review, display_name: AI科技评论, priority: P1, canonical_fallback_source_ids: [leiphone-ai]}
  - {id: wechat-zhidx, display_name: 智东西, priority: P1, canonical_fallback_source_ids: [zhidx]}
