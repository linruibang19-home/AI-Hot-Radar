schema_version: 1
registry_version: "2026-08-01.1"
project: AI Hot Radar

# Social posts are discovery signals, not canonical evidence. Keep every item
# disabled until an authorized API/provider is configured. A story may use a
# social post only after resolving one of its canonical_fallback_source_ids or
# after preserving the authorized post URL and platform metadata.
defaults:
  enabled: false
  content_access: discovery_only
  adapter: authorized_provider_only
  public_render: no_public_content
  poll_interval: PT10M
  require_canonical_resolution: true

x_accounts:
  - {id: x-openai, handle: "@OpenAI", owner: OpenAI, priority: P0, canonical_fallback_source_ids: [openai-news, openai-api-changelog, openai-codex-changelog]}
  - {id: x-anthropic, handle: "@AnthropicAI", owner: Anthropic, priority: P0, canonical_fallback_source_ids: [anthropic-news, anthropic-api-release-notes, anthropic-claude-code-changelog]}
  - {id: x-google-deepmind, handle: "@GoogleDeepMind", owner: Google DeepMind, priority: P0, canonical_fallback_source_ids: [google-deepmind-blog, google-research-blog]}
  - {id: x-google-ai, handle: "@GoogleAI", owner: Google, priority: P0, canonical_fallback_source_ids: [google-ai-blog, gemini-api-changelog]}
  - {id: x-meta-ai, handle: "@MetaAI", owner: Meta, priority: P0, canonical_fallback_source_ids: [meta-ai-blog, meta-engineering-ai]}
  - {id: x-xai, handle: "@xai", owner: xAI, priority: P0, canonical_fallback_source_ids: [xai-news]}
