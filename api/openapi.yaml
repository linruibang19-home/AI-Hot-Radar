openapi: 3.1.0
info:
  title: AI Hot Radar API
  version: 1.4.0
  description: Public content, report subscriptions, RAG and source administration baseline contract.
servers:
  - url: /api/v1
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: source, in: query, schema: {type: string}}
        - {name: topic, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 300}}
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ItemPage'}
        '400': {$ref: '#/components/responses/Problem'}
  /items/{idOrSlug}:
    get:
      operationId: getItem
      parameters:
        - {name: idOrSlug, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Item detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Item'}
        '404': {$ref: '#/components/responses/Problem'}
  /stories:
    get:
      operationId: listStories
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Story page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoryPage'}
  /stories/{idOrSlug}:
    get:
      operationId: getStory
      parameters:
        - {name: idOrSlug, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Story detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Story'}
  /rag/queries:
    post:
      operationId: createRagQuery
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RagQueryRequest'}
      responses:
        '202':
          description: Query accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RagQueryAccepted'}
        '429': {$ref: '#/components/responses/Problem'}
  /rag/answers/{id}:
    get:
      operationId: getRagAnswer
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Final answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RagAnswer'}
  /subscriptions:
    post:
      operationId: requestReportSubscription
      description: Request a double-opt-in email subscription. The neutral response never reveals whether the email already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionRequest'}
      responses:
        '202':
          description: Confirmation delivery accepted or recently requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /subscriptions/confirm:
    post:
      operationId: confirmReportSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionTokenRequest'}
      responses:
        '200':
          description: Subscription activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionResponse'}
        '400': {$ref: '#/components/responses/Problem'}
  /subscriptions/unsubscribe:
    post:
      operationId: unsubscribeReportSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionTokenRequest'}
      responses:
        '200':
          description: Subscription disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionResponse'}
        '400': {$ref: '#/components/responses/Problem'}
  /admin/sources/{id}/run:
    post:
      operationId: runSource
      security: [{adminBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '202':
          description: Probe/run accepted
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: {type: string, format: uuid}
                  status: {const: PENDING}
  /admin/models/generation:
    get:
      operationId: getGenerationModelConfiguration
      security: [{adminBearer: []}]
      responses:
        '200':
          description: Current DeepSeek generation model and enabled catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationModelState'}
        '401': {$ref: '#/components/responses/Problem'}
  /admin/models/generation/{modelId}/select:
    post:
      operationId: selectGenerationModel
      security: [{adminBearer: []}]
      parameters:
        - {name: modelId, in: path, required: true, schema: {type: string, enum: [deepseek-v4-flash, deepseek-v4-pro]}}
        - {name: X-Confirm-Target, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 300}
      responses:
        '200':
          description: Selection stored; applies to future generation clients
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationModelSelection'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    adminBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Item:
      type: object
      required: [id, title, canonicalUrl, source, observedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: [string, 'null']}
        excerpt: {type: [string, 'null']}
        canonicalUrl: {type: string, format: uri}
        publishedAt: {type: [string, 'null'], format: date-time}
        observedAt: {type: string, format: date-time}
        source: {$ref: '#/components/schemas/SourceRef'}
        topics: {type: array, items: {type: string}}
    SourceRef:
      type: object
      required: [id, name, tier]
      properties:
        id: {type: string}
        name: {type: string}
        tier: {type: string}
    Story:
      type: object
      required: [id, title, firstSeenAt, sources]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: [string, 'null']}
        firstSeenAt: {type: string, format: date-time}
        lastUpdatedAt: {type: string, format: date-time}
        sources: {type: array, items: {$ref: '#/components/schemas/Item'}}
    PageMeta:
      type: object
      required: [hasMore]
      properties:
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
    ItemPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Item'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    StoryPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Story'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    RagQueryRequest:
      type: object
      required: [question, timezone]
      properties:
        question: {type: string, minLength: 2, maxLength: 2000}
        conversationId: {type: [string, 'null'], format: uuid}
        timezone: {type: string, default: Asia/Shanghai}
        answerFormat: {enum: [brief, detailed, timeline, comparison]}
        filters: {type: object, additionalProperties: true}
    RagQueryAccepted:
      type: object
      required: [queryId, status, streamUrl]
      properties:
        queryId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        status: {const: PENDING}
        streamUrl: {type: string, format: uri-reference}
    Citation:
      type: object
      required: [number, title, url, publishedAt]
      properties:
        number: {type: integer}
        title: {type: string}
        url: {type: string, format: uri}
        publishedAt: {type: [string, 'null'], format: date-time}
        sourceTier: {type: string}
    RagAnswer:
      type: object
      required: [id, status, answer, citations]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [COMPLETED, INSUFFICIENT_EVIDENCE]}
        answer: {type: string}
        citations: {type: array, items: {$ref: '#/components/schemas/Citation'}}
        limitations: {type: array, items: {type: string}}
        metrics: {type: object, additionalProperties: true}
    ReportPeriod:
      type: string
      enum: [daily, weekly, monthly]
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [email, periods, timezone]
      properties:
        email: {type: string, format: email, maxLength: 320}
        periods:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {$ref: '#/components/schemas/ReportPeriod'}
        timezone: {type: string, minLength: 1, maxLength: 64, example: Asia/Shanghai}
    SubscriptionTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 2048, writeOnly: true}
    SubscriptionResponse:
      type: object
      required: [status, message, periods]
      properties:
        status: {enum: [PENDING_CONFIRMATION, ACTIVE, UNSUBSCRIBED]}
        message: {type: string}
        periods:
          type: array
          items: {$ref: '#/components/schemas/ReportPeriod'}
    GenerationModel:
      type: object
      required: [model_id, display_name, description, context_window_tokens, input_cny_per_million, cached_input_cny_per_million, output_cny_per_million, pricing_effective_on, pricing_source]
      properties:
        model_id: {type: string, enum: [deepseek-v4-flash, deepseek-v4-pro]}
        display_name: {type: string}
        description: {type: string}
        context_window_tokens: {type: integer}
        input_cny_per_million: {type: number}
        cached_input_cny_per_million: {type: number}
        output_cny_per_million: {type: number}
        pricing_effective_on: {type: string, format: date}
        pricing_source: {type: string, format: uri}
        version: {type: integer}
        updated_at: {type: string, format: date-time}
    GenerationModelState:
      type: object
      required: [current, available, thinkingEnabled, retrievalModels]
      properties:
        current: {$ref: '#/components/schemas/GenerationModel'}
        available:
          type: array
          items: {$ref: '#/components/schemas/GenerationModel'}
        thinkingEnabled: {type: boolean, const: false}
        retrievalModels: {type: string, const: siliconflow-fixed}
    GenerationModelSelection:
      type: object
      required: [current, thinkingEnabled]
      properties:
        current: {$ref: '#/components/schemas/GenerationModel'}
        thinkingEnabled: {type: boolean, const: false}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        requestId: {type: string}

