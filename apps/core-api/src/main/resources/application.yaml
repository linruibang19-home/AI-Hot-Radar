spring:
  application:
    name: core-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ai_hot_radar}
    username: ${POSTGRES_USER:ai_hot_radar}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10

  # AHR-SPEC-000 §8: Flyway is the only path that may change the schema.
  # Migrations live at the repository root so Java, Python and CI share one set.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # V017.1 repairs the prerequisite of the already-released V018 data
    # migration without changing V018's checksum on existing databases.
    out-of-order: true

  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379/0}
      timeout: 3000

# AHR-QSO-700 §3 / AHR-API-500: every /api/v1/admin/** request needs a bearer
# token. Unset means no credential is registered and the admin API refuses
# everything — a missing secret must fail closed, not open.
ahr:
  admin:
    bootstrap-token: ${AHR_ADMIN_BOOTSTRAP_TOKEN:}
    # The web tier's own credential, read-only: it renders the console during
    # SSR and never mutates.
    viewer-token: ${AHR_ADMIN_VIEWER_TOKEN:}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # request_id comes from RequestIdFilter's MDC entry.
    console: '{"service":"core-api","level":"%level","request_id":"%X{request_id:--}","logger":"%logger{36}","message":"%msg"}%n'
