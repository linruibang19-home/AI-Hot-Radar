[project]
name = "ai-hot-radar-ai-service"
version = "0.1.0"
description = "AI Hot Radar ingestion, extraction, enrichment and RAG worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
# Tracing is opt-in. A deployment that exports no traces should not have to
# carry an exporter, and `ahr.tracing` degrades to a no-op when it is absent.
tracing = [
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    # Upper bound deliberate. `pip install -e ".[dev]"` otherwise resolves to
    # whatever is newest on the day CI runs, so a green build can turn red with
    # no commit in between. That had already happened: fifteen errors across two
    # files nobody had touched, in a job that had been passing. A checker whose
    # verdict depends on its install date is checking the calendar, not the code.
    # Raise this on purpose, with the fixes it demands in the same commit.
    "mypy>=1.13.0,<2.0",
    "jsonschema>=4.23.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The enrichment prompt is Chinese prose whose lines are part of the contract
# with the model; wrapping it to satisfy the linter would change the prompt.
"src/ahr/processing/schemas.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Optional at runtime and absent from the default image, so there is nothing to
# resolve against. `ahr.tracing` guards every use behind an ImportError.
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# feedparser and trafilatura ship no type stubs; their return values are
# narrowed explicitly at each call site instead.
module = ["feedparser.*", "trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
