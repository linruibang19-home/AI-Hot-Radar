[project]
name = "ai-hot-radar-ai-service"
version = "0.1.0"
description = "AI Hot Radar ingestion, extraction, enrichment and RAG worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "jsonschema>=4.23.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The enrichment prompt is Chinese prose whose lines are part of the contract
# with the model; wrapping it to satisfy the linter would change the prompt.
"src/ahr/processing/schemas.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# feedparser and trafilatura ship no type stubs; their return values are
# narrowed explicitly at each call site instead.
module = ["feedparser.*", "trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
