schema_version: 2
registry_version: "2026-08-01.1"
project: AI Hot Radar

# This registry separates discovery from document acquisition. A source is not
# considered "full-text capable" merely because its listing page is reachable.
verification_levels:
  protocol_guaranteed: "Standard public protocol/API; enable after one fixture smoke test"
  page_confirmed: "Official/public listing and article pages confirmed readable"
  adapter_required: "Public content exists but a site-specific selector/browser adapter is required"
  restricted: "Authorization, subscription, or contracted provider required; disabled by default"

content_access_levels:
  full_release_text: "Complete release note/changelog/model card is the source document"
  full_article_extract: "Fetch article URL and extract readable body for internal search/RAG"
  full_paper: "Fetch abstract plus lawful open paper HTML/PDF and parse it"
  metadata_abstract: "Metadata/abstract only; fetch the original on demand when permitted"
  discovery_only: "Signal only; never use as final RAG evidence without a canonical source"

public_render_policies:
  excerpt_link: "Store full text internally when permitted; expose title, short excerpt, summary, citation, canonical link"
  release_text_link: "Release notes may be shown with conservative excerpts and canonical link"
  metadata_link: "Expose metadata/abstract and canonical link only"
  no_public_content: "Do not expose copied content"

profiles:
  rss_to_article:
    discovery: rss_atom
    document_fetch: conditional_http_html
    extractor_chain: [json_ld, trafilatura, readability, site_selector, playwright_if_allowed]
    requires_article_fetch: true
    respects: [robots_txt, etag, last_modified, retry_after]
  static_listing_to_article:
    discovery: html_listing_or_sitemap
    document_fetch: conditional_http_html
    extractor_chain: [json_ld, trafilatura, readability, site_selector]
    requires_article_fetch: true
    respects: [robots_txt, etag, last_modified, retry_after]
  dynamic_listing_to_article:
    discovery: html_or_embedded_json
    document_fetch: browser_only_after_http_failure
    extractor_chain: [embedded_json, site_selector, playwright_if_allowed]
    requires_article_fetch: true
    respects: [robots_txt, access_controls, retry_after]
  docs_changelog:
    discovery: page_hash_and_heading_diff
    document_fetch: conditional_http_html
    extractor_chain: [main_selector, markdown_conversion]
    requires_article_fetch: false
    respects: [robots_txt, etag, last_modified]
  github_release_api:
    discovery: github_releases_api
    document_fetch: github_release_body
    api_template: "https://api.github.com/repos/{repository}/releases"
    fallback_template: "https://github.com/{repository}/releases.atom"
    requires_article_fetch: false
    respects: [etag, last_modified, github_rate_limit]
  github_repo_activity:
    discovery: github_events_tags_commits
    document_fetch: github_markdown_raw
    api_template: "https://api.github.com/repos/{repository}"
    requires_article_fetch: false
    respects: [etag, github_rate_limit]
  arxiv_feed_paper:
    discovery: arxiv_rss
    document_fetch: arxiv_html_then_pdf
    feed_template: "https://rss.arxiv.org/rss/{subject}"
    requires_article_fetch: true
    respects: [arxiv_api_terms, rate_limit]
  public_json_api:
    discovery: cursor_or_timestamp_api
    document_fetch: json_or_canonical_document
    requires_article_fetch: false
    respects: [api_terms, rate_limit, retry_after]
  author_feed_to_article:
    discovery: rss_atom
    document_fetch: conditional_http_html
    extractor_chain: [json_ld, trafilatura, readability]
    requires_article_fetch: true
    respects: [robots_txt, etag, last_modified]
  restricted_social:
    discovery: authorized_provider_only
    document_fetch: none
    requires_article_fetch: false
    respects: [platform_terms, authorization]

defaults:
  timezone: UTC
  timeout_seconds: 20
  max_attempts: 3
  respect_robots: true
  internal_retention: "full_text_if_permitted"
  public_render: excerpt_link
  poll_interval: PT30M
  runtime_gate: "HTTP 2xx/304 + parse non-empty + canonical URL + published_at + fixture test"

