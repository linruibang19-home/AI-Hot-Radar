# Presentation metadata for the topic map.
#
# `topics` above remains the vocabulary authority: normalisation reads only that
# mapping, so an entry here for an unrecognised slug changes nothing about which
# labels are accepted. Kept in config rather than in the page because the site,
# the report renderer and the email template all need the same display names,
# and a slug titlecased in the frontend produced "Llm" and "Rag".
topic_groups:
  models:
    label: 模型能力
    order: 1
    description: 模型本身能做什么——发布、能力边界与技术路线
  engineering:
    label: 工程实践
    order: 2
    description: 把模型变成可用系统的方法：检索、智能体、部署与安全
  ecosystems:
    label: 生态与工具链
    order: 3
    description: 语言生态、开发工具与云平台侧的动态
  business:
    label: 产业与政策
    order: 4
    description: 资本、落地、算力与监管

